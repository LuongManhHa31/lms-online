# Cấu hình Upstream
upstream lms_backend {
    server lms-app:3000;
    keepalive 32;
}

upstream phpmyadmin_backend {
    server phpmyadmin:80;
}

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 192.168.59.132 _;
    charset utf-8;

    # Kích thước tải lên tối đa
    client_max_body_size 64M;

    # Nén Gzip tối ưu tốc độ truyền tải
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cấu hình Hardening: Thêm các Security Headers bảo vệ ứng dụng
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Đăng nhập và nhật ký truy cập Nginx
    access_log /var/log/nginx/lms_access.log;
    error_log /var/log/nginx/lms_error.log warn;

    # Endpoint trạng thái Nginx phục vụ giám sát nội bộ
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # Định tuyến tới phpMyAdmin qua đường dẫn /phpmyadmin/
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Định tuyến mặc định tới Ứng dụng LMS Web App (Node.js)
    location / {
        proxy_pass http://lms_backend;
        proxy_http_version 1.1;

        # Hỗ trợ WebSockets và HTTP Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
